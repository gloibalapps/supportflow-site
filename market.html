<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SupportFlow · Marketing Diary</title><style>:root{--n:#0e2038;--g:#d4a03d;--bg:#f5f7fa;--l:#dfe5ec}*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui;background:var(--bg);color:#172235}header{background:var(--n);color:white;padding:22px}.w{max-width:1180px;margin:auto;padding:0 16px}.brand{font-size:24px;font-weight:800}.brand span{color:var(--g)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.c{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px}.big{font-size:25px;font-weight:800}form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #ccd5df;border-radius:9px}textarea{grid-column:span 2}button{background:var(--n);color:white;border:0;font-weight:700}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px;border-bottom:1px solid var(--l);text-align:left}.login{max-width:420px;margin:90px auto}@media(max-width:760px){.grid,form{grid-template-columns:1fr 1fr}.table{overflow:auto}}</style></head><body><header><div class="w"><div class="brand">Support<span>Flow</span> · Marketing Diary</div><div>Private owner dashboard · Build 27</div></div></header><main class="w"><section id="login" class="c login"><h2>Marketing diary</h2><p>Enter the owner password.</p><input id="pw" type="password" placeholder="Password"> <button onclick="login()">Open diary</button><p id="err"></p></section><section id="app" hidden><div class="grid"><div class="c">Total spent<div class="big" id="total">$0.00</div></div><div class="c">Entries<div class="big" id="count">0</div></div><div class="c">Signups<div class="big" id="signups">0</div></div><div class="c">Cost / signup<div class="big" id="cps">—</div></div></div><div class="c"><h2>Add activity / cost</h2><form id="f"><input name="date" type="date" required><select name="channel"><option>Facebook</option><option>Instagram</option><option>TikTok</option><option>YouTube</option><option>Reddit</option><option>Gumtree</option><option>Google</option><option>Email</option><option>Domain/hosting</option><option>Software/AI</option><option>Other</option></select><input name="campaign" placeholder="Campaign / activity"><input name="cost" type="number" min="0" step=".01" placeholder="Cost $"><input name="signups" type="number" min="0" step="1" placeholder="Signups"><select name="cost_type"><option>Advertising</option><option>Recurring</option><option>One-off</option></select><input name="link" placeholder="Link / reference"><textarea name="notes" placeholder="What you did, result, notes"></textarea><button>Add entry</button></form></div><div class="c"><div style="display:flex;justify-content:space-between"><h2>Diary</h2><button onclick="csv()">Export CSV</button></div><div class="table"><table><thead><tr><th>Date</th><th>Channel</th><th>Campaign</th><th>Type</th><th>Cost</th><th>Signups</th><th>Notes</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><script>let token="",entries=[],$=i=>document.getElementById(i);async function login(){let r=await fetch('/.netlify/functions/market-data',{headers:{Authorization:'Bearer '+$('pw').value}});if(!r.ok){$('err').textContent='Incorrect password or diary not configured.';return}token=$('pw').value;entries=await r.json();$('login').hidden=true;$('app').hidden=false;render()}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){let t=entries.reduce((a,e)=>a+Number(e.cost||0),0),s=entries.reduce((a,e)=>a+Number(e.signups||0),0);$('total').textContent='$'+t.toFixed(2);$('count').textContent=entries.length;$('signups').textContent=s;$('cps').textContent=s?'$'+(t/s).toFixed(2):'—';$('rows').innerHTML=entries.map(e=>`<tr><td>${esc(e.entry_date)}</td><td>${esc(e.channel)}</td><td>${esc(e.campaign||'')}</td><td>${esc(e.cost_type||'')}</td><td>$${Number(e.cost||0).toFixed(2)}</td><td>${Number(e.signups||0)}</td><td>${esc(e.notes||'')}</td></tr>`).join('')}$('f').onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target)),r=await fetch('/.netlify/functions/market-data',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(o)});if(r.ok){entries=await r.json();e.target.reset();render()}};function csv(){let h=['Date','Channel','Campaign','Type','Cost','Signups','Link','Notes'],a=[h,...entries.map(e=>[e.entry_date,e.channel,e.campaign,e.cost_type,e.cost,e.signups,e.link,e.notes])],q=v=>'"'+String(v??'').replaceAll('"','""')+'"',b=new Blob([a.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}),u=URL.createObjectURL(b),x=document.createElement('a');x.href=u;x.download='supportflow-marketing-diary.csv';x.click();URL.revokeObjectURL(u)}</script></body></html>
