[[redirects]]
  from = "/netlify/lib/*"
  to = "/404.html"
  status = 404
  force = true

# Clean URL for pricing page.
[[redirects]]
  from = "/pricing"
  to = "/pricing.html"
  status = 200

# Custom 404 — Netlify picks up 404.html automatically when it exists in publish dir,
# but this explicit rule ensures it applies to all unmatched paths.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
