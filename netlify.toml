# Static site, no build step. The only server-side piece is the AI proxy.
[build]
  publish = "."
  functions = "netlify/functions"

# SUPABASE_URL is deliberately public: it's baked into app.html's access-code
# gate (client-side, by design -- Supabase's own security model is RLS, not
# secrecy) as well as set as a build env var for the server-side functions.
# Netlify's scanner otherwise flags that overlap as a leaked secret, which
# it isn't; this tells it to skip that one key rather than failing the build.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

# The service worker must never be served stale, or testers get stuck on an
# old build after you redeploy.

# App shell must never be served from an old HTTP/browser cache after a deploy.
[[headers]]
  for = "/app.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Home page must pick up a redeploy straight away.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Never cache the AI proxy's responses.
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"

# Old domain -> canonical domain (301). Marketing pages only: /app is deliberately NOT
# redirected, because the app stores data in the browser per-origin and an installed
# copy on ndissupportflow.com would otherwise lose access to its records.
[[redirects]]
  from = "https://ndissupportflow.com/"
  to = "https://supportflow.work/"
  status = 301
  force = true

