  to = "https://cdn.opinly.ai/189uHQyY_N_n2WQp7qCAh/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/blog"
  to = "/.netlify/functions/opinly-blog"
  status = 200
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/.netlify/functions/opinly-blog?slug=:splat"
  status = 200
  force = true

[[headers]]
  for = "/app.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Block direct access to raw Markdown source files.
