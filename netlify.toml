# Serves app.html at /app as well as /app.html, regardless of whether
# Pretty URLs is on for this site -- Stripe's post-checkout redirect and
# anything else that links to "/app" shouldn't depend on that setting.
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

# Same for the waitlist page -- hosted here instead of as an external
# Claude Artifact link, since that link going stale is what broke the
# "Join the waitlist" button in the first place. This one's permanent.
[[redirects]]
  from = "/waitlist"
  to = "/app"
  status = 301

# The tester admin dashboard. Not linked from anywhere on the public
# site -- reaching it at all requires knowing this exact path, and
# reading anything requires the ADMIN_PASSWORD on top of that.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Owner-only dashboards (password protected, noindex).
[[redirects]]
  from = "/signups"
  to = "/signups.html"
  status = 200

[[redirects]]
  from = "/market"
  to = "/market.html"
  status = 200

# Clean public URL for the privacy policy, matching its canonical URL.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# Clean public URL for the Terms of Use.
[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# Public SEO resource pages.
[[redirects]]
  from = "/ndis-support-worker-invoice-template"
