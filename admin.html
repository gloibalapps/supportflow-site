<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>SupportFlow · Owner dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#12140E;--ink-2:#1A1D15;--ink-3:#22261C;--brass:#C8913A;--brass-lift:#E0A83F;--gold:#D4A03D;--paper:#F2EFE4;--muted:#8B8E82;--line:#2A2D23;--good:#5E9E77;--bad:#C0614F}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font-family:'Instrument Sans',system-ui,sans-serif;padding:28px clamp(16px,3vw,40px)}
h1{font-family:'Fraunces',Georgia,serif;font-weight:300;font-size:30px}h1 b{color:var(--gold);font-weight:400}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.meta{color:var(--muted);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.panel{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel.w2{grid-column:span 2}.panel.w4{grid-column:1/-1}
@media(max-width:620px){.panel.w2{grid-column:auto}}
.panel h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between}
.big{font-family:'Fraunces',serif;font-size:40px;color:var(--gold)}.sub{color:var(--muted);font-size:13px;margin-top:4px}
.soon{border-style:dashed;opacity:.7}.tag{font-size:10px;border:1px solid var(--gold);color:var(--gold);border-radius:99px;padding:1px 8px;letter-spacing:.06em}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:6px 4px;border-top:1px solid var(--line)}td:first-child{color:var(--muted);white-space:nowrap}
.bar{display:flex;align-items:flex-end;gap:3px;height:140px}.bar div{flex:1;background:var(--gold);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bar div.o{background:var(--ink-3)}.legend{font-size:12px;color:var(--muted);margin-top:8px}
form{display:flex;flex-wrap:wrap;gap:8px;max-width:420px;margin:12vh auto}input,button{font:inherit;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--ink-2);color:var(--paper)}
input{flex:1}button{background:var(--gold);color:#14150F;font-weight:600;border:0;cursor:pointer}
form label{flex:1 0 100%;font-size:12.5px;color:var(--muted)}
.err{color:var(--bad);text-align:center}
</style></head><body>
<div id="app"></div>
<script>
/* Owner dashboard, served at /admin. The token is checked server-side by admin-dashboard.mjs;
   this page holds no data until the server accepts the token.
   To add a panel: push an object onto PANELS: { id, title, size, render(data) -> html | null }.
   Returning null shows "unavailable" (data source missing). Set soon:true for placeholders. */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const aud = n => "A$" + Number(n || 0).toLocaleString("en-AU", {minimumFractionDigits: Number(n) % 1 ? 2 : 0, maximumFractionDigits: 2});
const PANELS = [
  // Stripe is the source of truth for money; when it's unavailable the
  // Supabase licence_payments cards below still show.
  { id: "stripe", title: "Stripe — live payments", size: "w4", render: d => {
      const s = d.stripe;
      if (!s) return `<div class="sub">Stripe unavailable (${esc(d.stripeError || "unknown")}) — showing Supabase licence_payments below.</div>`;
      const max = Math.max(1, ...s.trend.map(t => t.revenue));
      const k = (v, l) => `<div><div class="big" style="font-size:30px">${v}</div><div class="sub">${l}</div></div>`;
      return `<div class="sub" style="margin:-6px 0 12px">Charges created on/after ${esc(s.since.slice(0, 10))} (AUD, live Stripe)</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px">
        ${k(s.licenceSales.count, `licence sales · ${aud(s.licenceSales.grossAud)}`)}
        ${k(aud(s.grossAud), `gross · ${s.successfulPayments} payments (${s.otherCharges} non-licence)`)}
        ${k(s.feesAud === null ? "—" : aud(s.feesAud), "Stripe fees")}${k(aud(s.netAud), "net · " + esc(s.netBasis))}
        ${k(aud(s.refundsAud), `refunds · ${s.refundedCount} charges`)}${k(s.disputes, "disputes")}
        ${k(aud(s.balance.pendingAud), "balance pending")}${k(aud(s.balance.availableAud), "balance available")}</div>
      <div class="bar" style="height:90px;margin-top:16px">${s.trend.map(t => `<div title="${t.day}: ${aud(t.revenue)} (${t.count})" style="height:${(t.revenue / max) * 100}%"></div>`).join("")}</div>
      <div class="legend">Daily net-of-refund revenue, last ${s.trend.length} days.</div>
      <div style="display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-top:14px">
        <table>${s.recent.map(c => `<tr><td>${esc(c.at.slice(0, 16).replace("T", " "))}</td><td>${aud(c.amountAud)}</td><td>${esc(c.status)}${c.refundedAud ? " · refunded " + aud(c.refundedAud) : ""}${c.disputed ? " · disputed" : ""}</td><td>${esc(c.who || "—")}</td></tr>`).join("") || "<tr><td>No charges</td></tr>"}</table>
        <table>${s.payouts.map(p => `<tr><td>${esc(p.arrival)}</td><td>A$${p.amountAud.toFixed(2)}</td><td>${esc(p.status)}</td></tr>`).join("")}</table></div>`; } },
  { id: "visits", title: "Website visitors", size: "w4", render: d => {
      const v = d.visits; if (!v) return null;
      const max = Math.max(1, ...v.trend.map(t => t.visits));
      const k = (n, u, l) => `<div><div class="big" style="font-size:30px">${n.toLocaleString()}</div><div class="sub">${l} · ${u.toLocaleString()} unique</div></div>`;
      const list = (title, rows) => `<div><div class="sub" style="margin-bottom:6px;color:var(--paper)">${title}</div><table>${rows.map(([a, n]) => `<tr><td>${esc(a)}</td><td style="text-align:right">${n}</td></tr>`).join("") || "<tr><td>—</td></tr>"}</table></div>`;
      return `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">${k(v.today.visits, v.today.unique, "visits today")}${k(v.d7.visits, v.d7.unique, "visits 7 days")}${k(v.d30.visits, v.d30.unique, "visits 30 days")}</div>
      ${v.newReturning ? (() => { const nr = v.newReturning, c = (o, l) => o ? `<div><div class="big" style="font-size:24px">${o.new.toLocaleString()} new · ${o.returning.toLocaleString()} returning</div><div class="sub">${l}${o.unknown ? " · " + o.unknown + " unknown" : ""}</div></div>` : `<div><div class="sub">${l}: unavailable</div></div>`;
        return `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px">${c(nr.today, "today")}${c(nr.d7, "7 days")}${c(nr.sinceLaunch, nr.sinceLaunch?.since ? "since " + esc(nr.sinceLaunch.since) : "since launch")}</div>`; })() : ""}
      <div class="bar" style="height:90px;margin-top:16px">${v.trend.map(t => `<div title="${t.day}: ${t.visits} visits, ${t.unique} unique" style="height:${(t.visits / max) * 100}%"></div>`).join("")}</div>
      <div class="legend">Daily visits. Unique = distinct visitors per day (salted hash rotates daily, so multi-day totals are visitor-days). New/returning come from an on-device sf_seen marker, counted per visitor-day.</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-top:14px">
        ${list("Top pages", v.topPages)}${list("Top referrers", v.topReferrers)}${list("UTM source / campaign", v.topUtm)}${list("Countries / regions", v.countries)}</div>`; } },
  { id: "sales", title: "Sales (Supabase)", render: d => d.sales && `<div class="big">${d.sales.count}</div><div class="sub">paid checkouts · ${d.sales.refunded} refunded · ${d.sales.disputed} disputed</div>` },
  { id: "revenue", title: "Revenue (Supabase)", render: d => d.sales && `<div class="big">${aud(d.sales.revenueAud)}</div><div class="sub">gross, paid licence_payments</div>` },
  { id: "licences", title: "Active licences", render: d => d.licences && `<div class="big">${d.licences.active}</div><div class="sub">${d.licences.plan1} one-device · ${d.licences.plan2} phone+computer · ${d.licences.revoked} revoked</div>` },
  { id: "opens", title: "App first-opens", render: d => d.signups && `<div class="big">${d.signups.total}</div><div class="sub">devices (signup_attribution)</div>` },
  { id: "trend", title: "Daily trend · 30 days", size: "w4", render: d => {
      if (!d.trend) return null; const max = Math.max(1, ...d.trend.map(t => Math.max(t.sales, t.opens)));
      return `<div class="bar">${d.trend.map(t => `<div title="${t.day}: ${t.sales} sales, ${t.opens} opens" style="height:${(t.sales / max) * 100}%"></div>`).join("")}</div>
      <div class="legend">Gold = sales per day (${esc(d.trendBasis)}). ${d.trend[0].day} → ${d.trend.at(-1).day}. Hover a bar for opens.</div>`; } },
  { id: "activity", title: "Recent activity", size: "w2", render: d => d.activity && (d.activity.length
      ? `<table>${d.activity.map(a => `<tr><td>${esc(String(a.at).slice(0, 16).replace("T", " "))}</td><td>${esc(a.kind)}</td><td>${esc(a.detail)}</td><td>${esc(a.who || "—")}</td></tr>`).join("")}</table>`
      : `<div class="sub">No activity yet.</div>`) },
  { id: "sources", title: "Sign-ups by source", size: "w2", render: d => d.signups && (d.signups.bySource.length
      ? `<table>${d.signups.bySource.map(([k, n]) => `<tr><td>${esc(k)}</td><td>${n}</td></tr>`).join("")}</table>` : `<div class="sub">No first-opens recorded yet.</div>`) },
  // ---- Coming soon: modular slots for future upgrades ----
  { id: "utm", title: "Marketing / reel UTM performance", soon: true, note: "Conversion by utm_campaign: opens → paid licences." },
  { id: "lookup", title: "Licence lookup / restore", soon: true, note: "Search by email, view devices, resend restore link." },
  { id: "deliver", title: "Email deliverability", soon: true, note: "Resend delivery, bounce and complaint rates." },
  { id: "feedback", title: "Feedback", soon: true, note: "Latest in-app feedback submissions." },
];
const app = document.getElementById("app");
function login(msg) {
  app.innerHTML = `<form id="f"><label for="t">Password</label><input id="t" type="password" placeholder="Password" autocomplete="current-password" required><button>Open</button></form>${msg ? `<p class="err">${esc(msg)}</p>` : ""}`;
  document.getElementById("f").onsubmit = e => { e.preventDefault(); sessionStorage.setItem("sf:dash", document.getElementById("t").value); load(); };
}
async function load() {
  const tok = sessionStorage.getItem("sf:dash"); if (!tok) return login();
  let r; try { r = await fetch("/.netlify/functions/admin-dashboard?days=30", {headers: {Authorization: "Bearer " + tok}}); } catch { return login("Network error"); }
  if (r.status === 401) { sessionStorage.removeItem("sf:dash"); return login("Incorrect password"); }
  if (!r.ok) return login("Stats unavailable (" + r.status + ")");
  const d = await r.json();
  app.innerHTML = `<div class="top"><h1>Support<b>Flow</b> · Owner dashboard</h1><div class="meta">Source: ${esc(d.source || "—")}${d.stripe ? " + stripe" : ""} · ${esc(new Date(d.generatedAt).toLocaleString("en-AU"))} · <a href="#" id="out" style="color:var(--gold)">sign out</a></div></div>
  <div class="grid">${PANELS.map(p => {
    if (p.soon) return `<section class="panel soon ${p.size || ""}"><h3>${esc(p.title)} <span class="tag">COMING SOON</span></h3><div class="sub">${esc(p.note)}</div></section>`;
    let h; try { h = p.render(d); } catch { h = null; }
    return `<section class="panel ${p.size || ""}" data-panel="${p.id}"><h3>${esc(p.title)}</h3>${h || `<div class="sub">Unavailable — data source not reachable.</div>`}</section>`;
  }).join("")}</div>`;
  document.getElementById("out").onclick = e => { e.preventDefault(); sessionStorage.removeItem("sf:dash"); login(); };
}
load();
</script></body></html>
